[project]
name = "fleet-cdisc"
dynamic = ["version"]
description = "An opinionated framework to create CDISC SDTM/ADaM using Polars DataFrames via namespace extension"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Fleet Contributors" }
]
keywords = ["polars", "cdisc", "sdtm", "adam", "define.xml", "clinical-trials", "pharma", "namespace"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# CORE DEPENDENCIES
dependencies = [
    "polars>=1.41.1,<2",
    "pydantic>=2.11",
    "pyyaml>=6.0.1",
    "httpx>=0.27,<1",
    "jsonschema>=4.20",
    "lxml>=5.0.0",
    # Floor above the release with a critical advisory; the CDISC API key goes through this store.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# I/O: SAS XPT support (1.3.7: reads ISO 8601 formats as dates and skips deleted SAS records)
io = [
    "pyreadstat>=1.3.7",
]

# TLG-PDF: PDF export via WeasyPrint
tlg-pdf = [
    "weasyprint>=63",
    "brotli>=1.2.1; platform_python_implementation == 'CPython'",
]

# TLG-PPTX: slide deck export via python-pptx
tlg-pptx = [
    "python-pptx>=0.6.23",
]

# MIGRATE: libcst-based rewrite of deprecated verb/kwarg spellings
migrate = [
    "libcst>=1.0",
]

# WATCH: --watch mode for `fleet define-xml` and `fleet tlg run`
watch = [
    "watchfiles>=0.21",
]

# LSP: `fleet lsp --stdio` language server for define.yaml files
# 2.0 is the floor: `pygls.lsp.server` does not exist on 1.x.
lsp = [
    "pygls>=2.0",
]

# MCP: `fleet mcp --stdio` Model Context Protocol server
mcp = [
    "mcp>=1.26",
]

# FULL: All extras
all = [
    "fleet-cdisc[io]",
    "fleet-cdisc[tlg-pdf]",
    "fleet-cdisc[tlg-pptx]",
    "fleet-cdisc[migrate]",
    "fleet-cdisc[watch]",
    "fleet-cdisc[lsp]",
    "fleet-cdisc[mcp]",
]

# DEV: Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "fleet-cdisc[io]",
    "dsjson>=1.3",
    "pypdf>=5.0", # reads statistics back from rendered PDFs in tests
]

# DOCS: Documentation site
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.25",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-llmstxt>=0.2",
    "mike>=2.1",
]

[project.urls]
Homepage = "https://realslimmahdi.github.io/fleet-cdisc/"
Documentation = "https://realslimmahdi.github.io/fleet-cdisc/"
Changelog = "https://realslimmahdi.github.io/fleet-cdisc/changelog/"
Repository = "https://github.com/RealSlimMahdi/fleet-cdisc"
Issues = "https://github.com/RealSlimMahdi/fleet-cdisc/issues"

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI rejects the ``+g1234567`` hatch-vcs appends to untagged builds.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.sdist]
include = ["src/fleet", "README.md", "LICENSE", "pyproject.toml"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/fleet"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "blacken-docs>=1.19.0",
]
bench = [
    "rpy2>=3.6.7",
]
