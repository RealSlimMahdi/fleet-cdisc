[project]
name = "fleet-cdisc"
version = "0.1.0"
description = "An opinionated framework to create CDISC SDTM/ADaM using Polars DataFrames via namespace extension"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Fleet Contributors" }
]
keywords = ["polars", "cdisc", "sdtm", "adam", "define.xml", "clinical-trials", "pharma", "namespace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

# CORE DEPENDENCIES
dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
# I/O: SAS XPT support
io = [
    "pyreadstat>=1.2.0",
]

# TLG-PDF: PDF export via WeasyPrint
tlg-pdf = [
    "weasyprint>=62.0",
]

# TLG-PPTX: slide deck export via python-pptx
tlg-pptx = [
    "python-pptx>=0.6.23",
]

# FULL: All extras
all = [
    "fleet-cdisc[io]",
]

# DEV: Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "fleet-cdisc[io]",
    "dsjson>=1.3",
]

# DOCS: Documentation site
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.25",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-llmstxt>=0.2",
    "mike>=2.1",
]

[project.urls]
Repository = "https://github.com/RealSlimMahdi/fleet-cdisc"

[project.scripts]
fleet = "fleet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/fleet/adam/grading/criteria" = "fleet/adam/grading/criteria"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/fleet"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]
bench = [
    "rpy2>=3.6.7",
]
