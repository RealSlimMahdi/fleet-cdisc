[project]
name = "pymaverse"
version = "0.1.0"
description = "CDISC SDTM/ADaM toolkit for Polars DataFrames via namespace extension"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pymaverse Contributors" }
]
keywords = ["polars", "cdisc", "sdtm", "adam", "clinical-trials", "pharma", "namespace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

# CORE DEPENDENCIES
dependencies = [
    "polars>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "jsonschema>=4.26.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
# I/O: SAS XPT support
io = [
    "pyreadstat>=1.2.0",
]

# FULL: All extras
all = [
    "pymaverse[io]",
]

# DEV: Development tools
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pymaverse[io]",
]

[project.urls]
Repository = "https://github.com/pymaverse/pymaverse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymaverse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pymaverse"]
omit = ["tests/*"]
