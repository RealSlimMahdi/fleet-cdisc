name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff + blacken-docs)
        run: |
          uv run ruff check
          uv run ruff format --check
          rc=0; uv run blacken-docs --check --line-length 100 docs/**/*.md || rc=$?
          if [ "$rc" -eq 1 ]; then echo "Code blocks need formatting"; exit 1; fi

      - name: Regenerate llms.txt
        run: uv run python scripts/build_llms.py

      - name: Commit llms.txt if changed
        if: github.event_name == 'push' && matrix.python-version == '3.12'
        run: |
          git diff --quiet llms.txt && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llms.txt
          git commit -m "chore: regenerate llms.txt [skip ci]"
          git push

      - name: Fail PR if llms.txt is stale
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        run: |
          if ! git diff --quiet llms.txt; then
            echo "::error::llms.txt is out of date. Run: uv run python scripts/build_llms.py"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest --cov=fleet --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
