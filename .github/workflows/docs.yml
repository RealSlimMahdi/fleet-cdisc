name: Docs

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version alias to deploy (e.g. 0.2.0, latest)"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for git-revision-date plugin

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version alias
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "alias=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "alias=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy docs with mike
        run: |
          if [[ "${{ steps.version.outputs.is_release }}" == "true" ]]; then
            uv run mike deploy \
              --push \
              --update-aliases \
              "${{ steps.version.outputs.alias }}" latest
          else
            uv run mike deploy \
              --push \
              "${{ steps.version.outputs.alias }}"
          fi

      - name: Set default version
        run: uv run mike set-default --push latest
