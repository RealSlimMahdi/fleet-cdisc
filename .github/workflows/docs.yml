name: Docs

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - "examples/**"
      - "src/**"
      - "README.md"
      - "GUIDE.md"
      - "STRUCTURE.md"
      - "llms.txt"
  pull_request:
    branches: [main, devel]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch: # redeploy main by hand

permissions:
  contents: read

jobs:
  # Build-only job for PRs (no deploy)
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs --no-dev

      - name: Build docs (validation only)
        run: uv run mkdocs build

      - name: Check mkdocstrings option blocks are parsed
        run: |
          if grep -rl "<p>options:" site; then
            echo "An options: block printed as text: indent it under its ::: line."
            exit 1
          fi

  # Deploy job for pushes to main and release tags
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize gh-pages pushes: concurrent runs (e.g. rapid successive
    # pushes) otherwise race mike and get non-fast-forward rejections.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs --no-dev

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Only a release tag writes "latest"; main writes "dev" (c1-625).
      - name: Deploy docs (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest

      - name: Deploy docs (main branch)
        if: github.ref == 'refs/heads/main'
        run: uv run mike deploy --push --update-aliases dev
