name: Docs

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - "examples/**"
      - "specs/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version alias to deploy (e.g. 0.2.0, dev)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history needed for git-revision-date plugin

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version alias
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            INPUT_VERSION="${{ github.event.inputs.version }}"
            echo "version=${INPUT_VERSION:-dev}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy docs (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == "latest" ]]; then
            uv run mike deploy --push "$VERSION"
          else
            uv run mike deploy --push --update-aliases "$VERSION" latest
          fi

      - name: Deploy docs (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          uv run mike deploy \
            --push \
            "${{ steps.version.outputs.version }}"

      - name: Set default version
        if: ${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.version != 'latest' }}
        run: uv run mike set-default --push latest

      - name: Set default version (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: uv run mike set-default --push dev
