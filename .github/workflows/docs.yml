name: Docs

on:
  push:
    branches: [main, devel]
    tags:
      - "v*"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
      - "examples/**"
      - "src/**"
      - "README.md"
      - "GUIDE.md"
      - "STRUCTURE.md"
      - "llms.txt"
  pull_request:
    branches: [main, devel]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version alias to deploy (e.g. 0.2.0, dev)"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  # Build-only job for PRs (no deploy)
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs --no-dev

      - name: Build docs (validation only)
        run: uv run mkdocs build

  # Deploy job for pushes to main, devel, and tags
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize gh-pages pushes: concurrent runs (e.g. rapid successive
    # pushes) otherwise race mike and get non-fast-forward rejections.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install doc dependencies
        run: uv sync --extra docs --no-dev

      - name: Configure git for mike
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version alias
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/devel ]]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
          else
            INPUT_VERSION="${{ github.event.inputs.version }}"
            echo "version=${INPUT_VERSION:-dev}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy docs (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest

      - name: Deploy docs (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          uv run mike deploy --push --update-aliases latest
          uv run mike set-default --push latest

      - name: Deploy docs (devel branch)
        if: github.ref == 'refs/heads/devel'
        run: uv run mike deploy --push dev
