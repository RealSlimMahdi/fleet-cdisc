name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # → PyPI on version tags (e.g. v0.2.0a1)
    branches:
      - devel # → TestPyPI

permissions:
  contents: read

env:
  UV_VERSION: "0.13.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Lint and test
        run: |
          uv sync --locked --extra dev
          uv run ruff check
          uv run ruff format --check
          uv run pytest

  fresh-install:
    uses: ./.github/workflows/fresh-install.yml

  build:
    needs: [test, fresh-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tag history

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build
        run: uv build --build-constraints build-constraints.txt

      # Upload first: no later tool in this job can change what goes to PyPI.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: checked/

      - name: Check the uploaded copy
        run: uvx twine==7.0.0 check --strict checked/*

      - name: Smoke-test the uploaded wheel
        run: |
          uv venv /tmp/smoke
          uv pip install -p /tmp/smoke/bin/python checked/*.whl
          /tmp/smoke/bin/python -c "import fleet, polars as pl; assert hasattr(pl.DataFrame(), 'sdtm')"
          /tmp/smoke/bin/fleet --version

  testpypi:
    needs: build
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: pipx run twine==7.0.0 upload --repository testpypi --skip-existing dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: register this repo, publish.yml and environment "pypi" on pypi.org.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
