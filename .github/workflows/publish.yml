name: Publish

on:
  push:
    tags:
      - "v*" # → PyPI on version tags (e.g. v0.2.0)
    branches:
      - devel # → TestPyPI

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Lint and test
        run: |
          uv sync --extra dev
          uv run ruff check
          uv run ruff format --check
          uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hatch-vcs reads the version from the tag history

      - uses: astral-sh/setup-uv@v5

      - name: Build and check
        run: |
          uv build
          uvx twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install -p /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import fleet, polars as pl; assert hasattr(pl.DataFrame(), 'sdtm')"
          /tmp/smoke/bin/fleet --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: pipx run twine upload --repository testpypi --skip-existing dist/*

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: register this repo, publish.yml and environment "pypi" on pypi.org.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
