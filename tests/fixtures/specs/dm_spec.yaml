# SDTM DM (Demographics) domain specification for CDISCPILOT01
# Maps dm_raw.csv raw columns → SDTM DM variables

domain: DM
description: >
  Demographics dataset for CDISCPILOT01 mapped from raw eCRF data
  using Pymaverse SDTM namespace derivation verbs.

variables:
  - target: STUDYID
    algorithm: hardcode_no_ct
    value: "CDISCPILOT01"

  - target: DOMAIN
    algorithm: hardcode_no_ct
    value: "DM"

  - target: USUBJID
    algorithm: assign_no_ct
    source: patient_number

  - target: SUBJID
    algorithm: assign_no_ct
    source: patient_number

  - target: SITEID
    algorithm: assign_no_ct
    source: site_id

  - target: AGE
    algorithm: assign_no_ct
    source: age

  - target: AGEU
    algorithm: hardcode_no_ct
    value: "YEARS"

  - target: SEX
    algorithm: assign_ct
    source: sex
    ct_codelist: C66731
    ct_mapping:
      "F": "F"
      "M": "M"

  - target: RACE
    algorithm: assign_ct
    source: race
    ct_codelist: C74457

  - target: ETHNIC
    algorithm: assign_ct
    source: ethnic
    ct_codelist: C66790

  - target: ACTARMCD
    algorithm: assign_no_ct
    source: arm_code

  - target: ACTARM
    algorithm: assign_no_ct
    source: arm_description

  - target: ARMCD
    algorithm: assign_no_ct
    source: arm_code

  - target: ARM
    algorithm: assign_no_ct
    source: arm_description

  - target: RFSTDTC
    algorithm: assign_datetime
    source: first_dose_date

  - target: RFENDTC
    algorithm: assign_datetime
    source: last_dose_date

  - target: RFICDTC
    algorithm: assign_datetime
    source: informed_consent_date
