# yaml-language-server: $schema=../../../src/fleet/define_xml/schemas/define_spec_schema.json
# ADaM Define Specification — CDISCPILOT01
# Single source of truth: describes output structure AND drives from_spec() derivations.
# Used for: (1) Define-XML 2.1 generation  (2) post-dataset structure checks  (3) pipeline execution.

fleet_spec_version: 2
study:
  id: CDISCPILOT01
  name: CDISCPILOT01
  description: >
    A Phase II, Randomized, Double-Blind, Placebo-Controlled, Parallel Group Study
    of the Efficacy, Safety, and Tolerability of Xanomeline in Patients with Mild
    to Moderate Alzheimer's Disease
  protocol_name: CDISCPILOT01
  originator: Fleet Team
  source_system: Fleet
  source_system_version: "0.1.0"
  standard: ADAMIG
  standard_version: "1.1"
  ct_version: "2023-12-15"

codelists:
  - oid: C66731
    name: Sex
    type: text
    items:
      - coded_value: "M"
        decode: MALE
      - coded_value: "F"
        decode: FEMALE

  - oid: CL.DTYPE
    name: Derivation Type
    type: text
    items:
      - coded_value: LOCF
        decode: Last Observation Carried Forward
      - coded_value: WOCF
        decode: Worst Observation Carried Forward

  - oid: CL.ANL01FL
    name: Analysis Flag ANL01
    type: text
    items:
      - coded_value: "Y"
        decode: "Yes"

datasets:
  # ───────────────────────────────────────────────────────────── ADSL ─── #
  - name: ADSL
    label: Subject-Level Analysis Dataset
    structure: One record per subject
    repeating: false
    class: SUBJECT LEVEL ANALYSIS DATASET
    keys: [STUDYID, USUBJID]
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          value: "CDISCPILOT01"

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: USUBJID

      - name: SUBJID
        label: Subject Identifier for the Study
        type: text
        length: 20
        mandatory: true
        origin: Collected
        derivation:
          algorithm: assign
          source: SUBJID

      - name: SITEID
        label: Study Site Identifier
        type: text
        length: 20
        mandatory: true
        origin: Collected
        derivation:
          algorithm: assign
          source: SITEID

      - name: AGE
        label: Age
        type: integer
        mandatory: true
        origin: Collected
        derivation:
          algorithm: assign
          source: AGE

      - name: AGEU
        label: Age Units
        type: text
        length: 10
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: AGEU

      - name: SEX
        label: Sex
        type: text
        length: 2
        mandatory: true
        origin: Collected
        codelist: C66731
        derivation:
          algorithm: assign
          source: SEX

      - name: RACE
        label: Race
        type: text
        length: 60
        mandatory: false
        origin: Collected
        derivation:
          algorithm: assign
          source: RACE

      - name: ETHNIC
        label: Ethnicity
        type: text
        length: 60
        mandatory: false
        origin: Collected
        derivation:
          algorithm: assign
          source: ETHNIC

      - name: ARMCD
        label: Planned Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARMCD

      - name: ARM
        label: Description of Planned Arm
        type: text
        length: 200
        mandatory: true
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARM

      - name: ACTARMCD
        label: Actual Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARMCD

      - name: ACTARM
        label: Description of Actual Arm
        type: text
        length: 200
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARM

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARM

      - name: TRT01A
        label: Actual Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARM

      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: derivation
          expression: RFXSTDTC

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: derivation
          expression: RFXENDTC

      - name: RFSTDTC
        label: Subject Reference Start Date/Time
        type: datetime
        mandatory: false
        origin: Collected
        derivation:
          algorithm: assign
          source: RFSTDTC

      - name: RFENDTC
        label: Subject Reference End Date/Time
        type: datetime
        mandatory: false
        origin: Collected
        derivation:
          algorithm: assign
          source: RFENDTC

      - name: RFICDTC
        label: Date/Time of Informed Consent
        type: datetime
        mandatory: false
        origin: Collected
        derivation:
          algorithm: assign
          source: RFICDTC

      - name: DTHFL
        label: Subject Death Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived

      - name: ITTFL
        label: Intent-To-Treat Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived

  # ───────────────────────────────────────────────────────────── ADVS ─── #
  - name: ADVS
    label: Analysis Dataset for Vital Signs
    structure: One record per subject per parameter per analysis timepoint
    repeating: true
    class: BASIC DATA STRUCTURE
    keys: [STUDYID, USUBJID, PARAMCD, VISITNUM]
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          value: "CDISCPILOT01"

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: patient_number

      - name: PARAMCD
        label: Parameter Code
        type: text
        length: 8
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: vstestcd

      - name: PARAM
        label: Parameter
        type: text
        length: 200
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: vstest

      - name: AVAL
        label: Analysis Value
        type: float
        mandatory: false
        origin: Derived
        comment: "Numeric analysis value; equal to VSSTRESN for continuous measures"
        derivation:
          algorithm: derivation
          expression: VSSTRESN

      - name: AVALU
        label: Analysis Value Units
        type: text
        length: 20
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: vsorresu

      - name: BASE
        label: Baseline Value
        type: float
        mandatory: false
        origin: Derived

      - name: CHG
        label: Change from Baseline
        type: float
        mandatory: false
        origin: Derived
        derivation:
          algorithm: chg
          aval: AVAL
          base: BASE

      - name: PCHG
        label: Percent Change from Baseline
        type: float
        mandatory: false
        origin: Derived
        derivation:
          algorithm: pchg
          aval: AVAL
          base: BASE

      - name: ADT
        label: Analysis Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: vsdtc

      - name: ADY
        label: Analysis Relative Day
        type: integer
        mandatory: false
        origin: Derived
        derivation:
          algorithm: duration
          end: ADT
          start: TRTSDT

      - name: VISITNUM
        label: Visit Number
        type: float
        mandatory: false
        origin: Protocol
        derivation:
          algorithm: assign
          source: visitnum

      - name: VISIT
        label: Visit Name
        type: text
        length: 200
        mandatory: false
        origin: Protocol
        derivation:
          algorithm: assign
          source: visit

      - name: DTYPE
        label: Derivation Type
        type: text
        length: 8
        mandatory: false
        origin: Derived
        codelist: CL.DTYPE

      - name: ANL01FL
        label: Analysis Flag 01
        type: text
        length: 2
        mandatory: false
        origin: Derived
        codelist: CL.ANL01FL

      - name: SUBJID
        label: Subject Identifier for the Study
        type: text
        length: 20
        mandatory: true
        origin: Collected

      - name: SITEID
        label: Study Site Identifier
        type: text
        length: 20
        mandatory: true
        origin: Collected

      - name: AGE
        label: Age
        type: integer
        mandatory: true
        origin: Collected

      - name: AGEU
        label: Age Units
        type: text
        length: 10
        mandatory: true
        origin: Assigned

      - name: SEX
        label: Sex
        type: text
        length: 2
        mandatory: true
        origin: Collected
        codelist: C66731

      - name: RACE
        label: Race
        type: text
        length: 60
        mandatory: false
        origin: Collected

      - name: ETHNIC
        label: Ethnicity
        type: text
        length: 60
        mandatory: false
        origin: Collected

      - name: ARMCD
        label: Planned Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Protocol

      - name: ARM
        label: Description of Planned Arm
        type: text
        length: 200
        mandatory: true
        origin: Protocol

      - name: ACTARMCD
        label: Actual Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Assigned

      - name: ACTARM
        label: Description of Actual Arm
        type: text
        length: 200
        mandatory: true
        origin: Assigned

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Protocol

      - name: TRT01A
        label: Actual Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Assigned

      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived

      - name: RFSTDTC
        label: Subject Reference Start Date/Time
        type: datetime
        mandatory: false
        origin: Collected

      - name: RFENDTC
        label: Subject Reference End Date/Time
        type: datetime
        mandatory: false
        origin: Collected

      - name: RFICDTC
        label: Date/Time of Informed Consent
        type: datetime
        mandatory: false
        origin: Collected

      - name: DTHFL
        label: Subject Death Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived

      - name: ITTFL
        label: Intent-To-Treat Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived
