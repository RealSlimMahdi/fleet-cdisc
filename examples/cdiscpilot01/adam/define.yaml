# yaml-language-server: $schema=../../../src/fleet/define_xml/schemas/define_spec_schema.json
# ADaM Define Specification — CDISCPILOT01
# Single source of truth: describes output structure AND drives from_spec() derivations.
# Used for: (1) Define-XML 2.1 generation  (2) post-dataset structure checks  (3) pipeline execution.

fleet_spec_version: 2
study:
  id: CDISCPILOT01
  name: CDISCPILOT01
  description: >
    A Phase II, Randomized, Double-Blind, Placebo-Controlled, Parallel Group Study
    of the Efficacy, Safety, and Tolerability of Xanomeline in Patients with Mild
    to Moderate Alzheimer's Disease
  protocol_name: CDISCPILOT01
  originator: Fleet Team
  source_system: Fleet
  standard: ADAMIG
  standard_version: "1.1"
  ct_version: "2023-12-15"

codelists:
  - oid: C66731
    name: Sex
    type: text
    items:
      - coded_value: "M"
        decode: MALE
      - coded_value: "F"
        decode: FEMALE

datasets:
  # ───────────────────────────────────────────────────────────── ADSL ─── #
  - name: ADSL
    label: Subject-Level Analysis Dataset
    structure: One record per subject
    repeating: false
    class: SUBJECT LEVEL ANALYSIS DATASET
    keys: [STUDYID, USUBJID]
    inputs:
      - name: DM
        type: dataset
      - name: EX
        type: dataset
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Predecessor
        predecessor: DM.STUDYID
        derivation:
          algorithm: assign
          source: STUDYID

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: USUBJID

      - name: SUBJID
        label: Subject Identifier for the Study
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: DM.SUBJID
        derivation:
          algorithm: assign
          source: SUBJID

      - name: SITEID
        label: Study Site Identifier
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: DM.SITEID
        derivation:
          algorithm: assign
          source: SITEID

      - name: AGE
        label: Age
        type: integer
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: DM.AGE
        derivation:
          algorithm: assign
          source: AGE

      - name: AGEU
        label: Age Units
        type: text
        length: 10
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: AGEU

      - name: SEX
        label: Sex
        type: text
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: DM.SEX
        codelist: C66731
        derivation:
          algorithm: assign
          source: SEX

      - name: RACE
        label: Race
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: DM.RACE
        derivation:
          algorithm: assign
          source: RACE

      - name: ETHNIC
        label: Ethnicity
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: DM.ETHNIC
        derivation:
          algorithm: assign
          source: ETHNIC

      - name: ARMCD
        label: Planned Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARMCD

      - name: ARM
        label: Description of Planned Arm
        type: text
        length: 200
        mandatory: true
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARM

      - name: ACTARMCD
        label: Actual Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARMCD

      - name: ACTARM
        label: Description of Actual Arm
        type: text
        length: 200
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARM

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Protocol
        derivation:
          algorithm: assign
          source: ARM

      - name: TRT01A
        label: Actual Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Assigned
        derivation:
          algorithm: assign
          source: ACTARM

      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: first_date
          from_dataset: EX
          date_col: EXSTDTC

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: last_date
          from_dataset: EX
          date_col: EXENDTC

      - name: RFSTDTC
        label: Subject Reference Start Date/Time
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: DM.RFSTDTC
        derivation:
          algorithm: assign
          source: RFSTDTC

      - name: RFENDTC
        label: Subject Reference End Date/Time
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: DM.RFENDTC
        derivation:
          algorithm: assign
          source: RFENDTC

      - name: RFICDTC
        label: Date/Time of Informed Consent
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: DM.RFICDTC
        derivation:
          algorithm: assign
          source: RFICDTC

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived
        comment: >-
          Y if the subject has at least one EX record with EXDOSE > 0, or with
          EXDOSE = 0 and EXTRT containing PLACEBO; else N.

      - name: ITTFL
        label: Intent-To-Treat Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived
        comment: Y if ARMCD is not SCRNFAIL; else N.

  # ───────────────────────────────────────────────────────────── ADVS ─── #
  - name: ADVS
    label: Analysis Dataset for Vital Signs
    structure: One record per subject per parameter per analysis timepoint
    repeating: true
    class: BASIC DATA STRUCTURE
    keys: [STUDYID, USUBJID, PARAMCD, ADT]
    inputs:
      - name: VS
        type: dataset
      - name: ADSL
        type: dataset
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          value: "CDISCPILOT01"

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Predecessor
        predecessor: VS.USUBJID
        derivation:
          algorithm: assign
          source: USUBJID

      - name: PARAMCD
        label: Parameter Code
        type: text
        length: 8
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: vstestcd

      - name: PARAM
        label: Parameter
        type: text
        length: 200
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: vstest

      - name: AVAL
        label: Analysis Value
        type: float
        length: 4
        significant_digits: 1
        mandatory: false
        origin: Derived
        comment: "Numeric analysis value; cast from raw vsorres string"
        derivation:
          algorithm: derivation
          expression: "pl.col('vsorres').cast(pl.Float64, strict=False)"

      - name: AVALU
        label: Analysis Value Units
        type: text
        length: 20
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: vsorresu

      - name: ADT
        label: Analysis Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: vsdtc

      - name: ADY
        label: Analysis Relative Day
        type: integer
        length: 1
        mandatory: false
        origin: Derived
        derivation:
          algorithm: duration
          end: ADT
          start: TRTSDT
          depends_on: [ADT]

      - name: ABLFL
        label: Baseline Record Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived
        derivation:
          algorithm: flag
          criteria: "pl.col('vsdy') <= 0"
          by: [USUBJID, PARAMCD]

      - name: BASE
        label: Baseline Value
        type: float
        length: 4
        significant_digits: 1
        mandatory: false
        origin: Derived
        derivation:
          algorithm: baseline
          aval: AVAL
          baseline_flag: ABLFL
          by: [USUBJID, PARAMCD]
          depends_on: [ABLFL]

      - name: CHG
        label: Change from Baseline
        type: float
        length: 1
        significant_digits: 0
        mandatory: false
        origin: Derived
        derivation:
          algorithm: chg
          aval: AVAL
          base: BASE
          depends_on: [BASE]

      - name: PCHG
        label: Percent Change from Baseline
        type: float
        length: 1
        significant_digits: 0
        mandatory: false
        origin: Derived
        derivation:
          algorithm: pchg
          aval: AVAL
          base: BASE
          depends_on: [BASE]

      - name: VISITNUM
        label: Visit Number
        type: float
        length: 4
        significant_digits: 1
        mandatory: false
        origin: Protocol

      - name: VISIT
        label: Visit Name
        type: text
        length: 200
        mandatory: false
        origin: Protocol

      - name: SUBJID
        label: Subject Identifier for the Study
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.SUBJID

      - name: SITEID
        label: Study Site Identifier
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.SITEID

      - name: AGE
        label: Age
        type: integer
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.AGE

      - name: AGEU
        label: Age Units
        type: text
        length: 10
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.AGEU

      - name: SEX
        label: Sex
        type: text
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.SEX
        codelist: C66731

      - name: RACE
        label: Race
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.RACE

      - name: ETHNIC
        label: Ethnicity
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.ETHNIC

      - name: ARMCD
        label: Planned Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.ARMCD

      - name: ARM
        label: Description of Planned Arm
        type: text
        length: 200
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.ARM

      - name: ACTARMCD
        label: Actual Arm Code
        type: text
        length: 20
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.ACTARMCD

      - name: ACTARM
        label: Description of Actual Arm
        type: text
        length: 200
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.ACTARM

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRT01P

      - name: TRT01A
        label: Actual Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRT01A

      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTSDT

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTEDT

      - name: RFSTDTC
        label: Subject Reference Start Date/Time
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.RFSTDTC

      - name: RFENDTC
        label: Subject Reference End Date/Time
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.RFENDTC

      - name: RFICDTC
        label: Date/Time of Informed Consent
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.RFICDTC

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.SAFFL

      - name: ITTFL
        label: Intent-To-Treat Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.ITTFL

  # ───────────────────────────────────────────────────────────── ADAE ─── #
  - name: ADAE
    label: Adverse Event Analysis Dataset
    structure: One record per subject per adverse event
    repeating: true
    class: OCCURRENCE DATA STRUCTURE
    subclass: ADVERSE EVENT
    keys: [STUDYID, USUBJID, ASEQ]
    inputs:
      - name: AE
        type: dataset
      - name: ADSL
        type: dataset
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          value: "CDISCPILOT01"

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Predecessor
        predecessor: AE.USUBJID
        derivation:
          algorithm: assign
          source: USUBJID

      - name: AETERM
        label: Reported Term for the Adverse Event
        type: text
        length: 200
        mandatory: true
        origin: Predecessor
        predecessor: AE.AETERM
        derivation:
          algorithm: assign
          source: AETERM

      - name: AESTDTC
        label: Start Date/Time of Adverse Event
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: AE.AESTDTC
        derivation:
          algorithm: assign
          source: AESTDTC

      - name: AEENDTC
        label: End Date/Time of Adverse Event
        type: datetime
        mandatory: false
        origin: Predecessor
        predecessor: AE.AEENDTC
        derivation:
          algorithm: assign
          source: AEENDTC

      - name: AESEV
        label: Severity/Intensity
        type: text
        length: 20
        mandatory: false
        origin: Predecessor
        predecessor: AE.AESEV
        derivation:
          algorithm: assign
          source: AESEV

      - name: AESER
        label: Serious Event
        type: text
        length: 2
        mandatory: false
        origin: Predecessor
        predecessor: AE.AESER
        derivation:
          algorithm: assign
          source: AESER

      - name: AEREL
        label: Causality
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: AE.AEREL
        derivation:
          algorithm: assign
          source: AEREL

      - name: AEOUT
        label: Outcome of Adverse Event
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: AE.AEOUT
        derivation:
          algorithm: assign
          source: AEOUT

      - name: AEACN
        label: Action Taken with Study Treatment
        type: text
        length: 60
        mandatory: false
        origin: Predecessor
        predecessor: AE.AEACN
        derivation:
          algorithm: assign
          source: AEACN

      - name: ASTDT
        label: Analysis Start Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: AESTDTC

      - name: AENDT
        label: Analysis End Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: AEENDTC

      - name: ADY
        label: Analysis Relative Day
        type: integer
        length: 2
        mandatory: false
        origin: Derived
        derivation:
          algorithm: duration
          end: ASTDT
          start: TRTSDT
          depends_on: [ASTDT]

      # ANL01FL and ASEQ use OCCDS verbs not expressible in from_spec;
      # derived inline in the pipeline after the spec phase.
      - name: TRTEMFL
        label: Treatment Emergent Analysis Flag
        type: text
        length: 2
        mandatory: false
        origin: Derived
        derivation:
          algorithm: occds.treatment_emergent
          start_date: ASTDT
          end_date: AENDT
          trtsdt: TRTSDT
          trtedt: TRTEDT
          end_window: 0
          depends_on: [ASTDT, AENDT]

      - name: ANL01FL
        label: Analysis Flag 01 (worst severity)
        type: text
        length: 2
        mandatory: false
        origin: Derived
        comment: >-
          Y on the one record with the highest AESEVN (MILD = 1, MODERATE = 2,
          SEVERE = 3) per USUBJID and AETERM.

      - name: ASEQ
        label: Analysis Sequence Number
        type: integer
        length: 1
        mandatory: true
        origin: Derived
        comment: Sequence number 1, 2, ... of the records of each USUBJID, in record order.

      # ── ADSL carry-through ────────────────────────────────────────────
      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTSDT

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTEDT

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRT01P

      - name: AGE
        label: Age
        type: integer
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.AGE

      - name: SEX
        label: Sex
        type: text
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.SEX

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.SAFFL

  # ───────────────────────────────────────────────────────────── ADEX ─── #
  - name: ADEX
    label: Exposure Analysis Dataset
    structure: One record per subject per exposure record
    repeating: true
    class: BASIC DATA STRUCTURE
    keys: [STUDYID, USUBJID, ASEQ]
    inputs:
      - name: EX
        type: dataset
      - name: ADSL
        type: dataset
    variables:
      - name: STUDYID
        label: Study Identifier
        type: text
        length: 12
        mandatory: true
        origin: Assigned
        derivation:
          algorithm: assign
          value: "CDISCPILOT01"

      - name: USUBJID
        label: Unique Subject Identifier
        type: text
        length: 40
        mandatory: true
        origin: Derived
        derivation:
          algorithm: assign
          source: USUBJID

      - name: EXTRT
        label: Name of Actual Treatment
        type: text
        length: 200
        mandatory: true
        origin: Predecessor
        predecessor: EX.EXTRT
        derivation:
          algorithm: assign
          source: EXTRT

      - name: EXDOSE
        label: Dose per Administration
        type: float
        length: 2
        significant_digits: 0
        mandatory: false
        origin: Predecessor
        predecessor: EX.EXDOSE
        derivation:
          algorithm: assign
          source: EXDOSE

      - name: EXDOSU
        label: Dose Units
        type: text
        length: 20
        mandatory: false
        origin: Predecessor
        predecessor: EX.EXDOSU
        derivation:
          algorithm: assign
          source: EXDOSU

      - name: ASTDT
        label: Analysis Start Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: EXSTDTC

      - name: AENDT
        label: Analysis End Date
        type: date
        mandatory: false
        origin: Derived
        derivation:
          algorithm: assign
          source: EXENDTC

      # ASEQ and EXDURD derived inline (not yet expressible in from_spec)
      - name: ASEQ
        label: Analysis Sequence Number
        type: integer
        length: 1
        mandatory: true
        origin: Derived
        comment: Sequence number 1, 2, ... of the records of each USUBJID, in record order.

      - name: EXDURD
        label: Exposure Duration (days, inclusive)
        type: integer
        length: 3
        mandatory: false
        origin: Derived
        comment: AENDT - ASTDT + 1, in days (end date included).

      # ── ADSL carry-through ────────────────────────────────────────────
      - name: TRTSDT
        label: Date of First Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTSDT

      - name: TRTEDT
        label: Date of Last Exposure to Treatment
        type: date
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRTEDT

      - name: TRT01P
        label: Planned Treatment for Period 01
        type: text
        length: 200
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.TRT01P

      - name: AGE
        label: Age
        type: integer
        length: 2
        mandatory: true
        origin: Predecessor
        predecessor: ADSL.AGE

      - name: SAFFL
        label: Safety Population Flag
        type: text
        length: 2
        mandatory: false
        origin: Predecessor
        predecessor: ADSL.SAFFL
