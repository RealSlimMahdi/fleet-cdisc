site_name: Pymaverse
site_description: CDISC SDTM/ADaM derivation toolkit for Polars DataFrames
site_url: https://pymaverse.github.io/pymaverse/
repo_url: https://github.com/pymaverse/pymaverse
repo_name: pymaverse/pymaverse
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pymaverse/pymaverse

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false          # notebooks are pre-executed and committed with output
      include_source: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Concepts:
      - How define.yaml Works: concepts/define-yaml.md
      - Namespace Pipeline: concepts/pipeline.md
  - Examples:
      - ADSL Pipeline (CDISCPILOT01): examples/adsl_pipeline.ipynb
  - API Reference:
      - Overview: api/index.md
      - SDTM Namespace: api/sdtm.md
      - ADaM Namespace: api/adam.md
      - ADSL Namespace: api/adsl.md
      - OCCDS Namespace: api/occds.md
      - Therapeutic Areas: api/ta.md
      - Define-XML: api/define_xml.md
      - Controlled Terminology: api/ct.md
      - Core: api/core.md
  - Test Status: test-status.md
  - Changelog: changelog.md
