# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-EX-008: EX start date after death date
# Based on: sdtmchecks::check_ex_exstdtc_after_dd. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-EX-008
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - INTERVENTIONS
  Domains:
    Include:
    - EX
Check:
  all:
  - any:
    - name: EXOCCUR
      operator: not_exists
    - name: EXOCCUR
      operator: equal_to
      value: Y
      value_is_literal: true
  - name: EXSTDTC
    operator: non_empty
  - name: $dm_dthdtc
    operator: non_empty
  - name: EXSTDTC
    operator: date_greater_than
    value: $dm_dthdtc
    date_component: auto
Operations:
- operator: max_date
  domain: DM
  name: DTHDTC
  id: $dm_dthdtc
  group:
  - USUBJID
Outcome:
  Message: EXSTDTC is after the death date (DM.DTHDTC).
  Output Variables:
  - USUBJID
  - EXTRT
  - EXSTDTC
  - $dm_dthdtc
Description: 'Flags: EXSTDTC is after the death date (DM.DTHDTC). Based on sdtmchecks::check_ex_exstdtc_after_dd.
  Difference from the R function: The death date is DM.DTHDTC. The R function takes the earliest of AEDTHDTC
  and the DS death dates. Partial dates are compared at their common precision; R imputes day 01.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-EX-008
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ex_exstdtc_after_dd
        Document: pharmaverse sdtmchecks
        Section: EX Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [EX]
