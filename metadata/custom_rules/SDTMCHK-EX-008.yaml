# SDTMCHK-EX-008: EX start date after death date
# Source: sdtmchecks::check_ex_exstdtc_after_dd

Core:
  Id: SDTMCHK-EX-008
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [INTERVENTIONS]
  Domains:
    Include: [EX]

Check:
  all:
    - name: EXSTDTC
      operator: non_empty
    - name: $ds_death_date
      operator: non_empty
    - name: EXSTDTC
      operator: date_greater_than
      value: $ds_death_date
      date_component: auto

Operations:
  - operator: max_date
    domain: DS
    name: DSSTDTC
    id: $ds_death_date
    group:
      - USUBJID
    filter:
      DSDECOD: DEATH

Outcome:
  Message: >-
    Exposure start date (EXSTDTC) is after the death date from DS.
    Subjects should not have exposure records after death.
  Output Variables: [USUBJID, EXTRT, EXSTDTC, $ds_death_date]

Description: >-
  EXSTDTC should not be after the death date (DSSTDTC where DSDECOD='DEATH').

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-EX-008
              Version: '1'
            Citations:
              - Cited Guidance: check_ex_exstdtc_after_dd
                Document: Roche sdtmchecks
                Section: EX Domain
