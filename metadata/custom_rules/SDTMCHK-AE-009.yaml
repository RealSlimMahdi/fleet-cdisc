# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-009: AEOUT=NOT RECOVERED/NOT RESOLVED but AEENDTC populated
# Based on: sdtmchecks::check_ae_aeout_aeendtc_nonfatal (second condition). Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-009
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - AE
Check:
  all:
  - name: AEENDTC
    operator: non_empty
  - name: AEOUT
    operator: is_contained_by
    value:
    - UNKNOWN
    - NOT RECOVERED/NOT RESOLVED
    - RECOVERING/RESOLVING
Outcome:
  Message: AEOUT is UNKNOWN, NOT RECOVERED/NOT RESOLVED or RECOVERING/RESOLVING but AEENDTC is populated.
  Output Variables:
  - USUBJID
  - AETERM
  - AEDECOD
  - AEOUT
  - AEENDTC
Description: 'Flags: AEOUT is UNKNOWN, NOT RECOVERED/NOT RESOLVED or RECOVERING/RESOLVING but AEENDTC
  is populated. Based on sdtmchecks::check_ae_aeout_aeendtc_nonfatal. Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-AE-009
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ae_aeout_aeendtc_nonfatal
        Document: pharmaverse sdtmchecks
        Section: AE Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [AE]
