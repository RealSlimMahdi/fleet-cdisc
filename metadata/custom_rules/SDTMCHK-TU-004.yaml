# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TU-004: Same TU date across different visits
# Based on: sdtmchecks::check_tu_tudtc_across_visit. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-TU-004
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - TU
Check:
  all:
  - name: TUDTC
    operator: non_empty
  - any:
    - name: TUEVAL
      operator: not_exists
    - name: TUEVAL
      operator: empty
    - name: TUEVAL
      operator: equal_to_case_insensitive
      value: INVESTIGATOR
  - name: VISITNUM
    operator: is_inconsistent_across_dataset
    value:
    - USUBJID
    - TUDTC
Outcome:
  Message: The same TUDTC is at more than one visit (investigator records).
  Output Variables:
  - USUBJID
  - TULINKID
  - TUTESTCD
  - TUDTC
  - VISIT
  - VISITNUM
Description: 'Flags: The same TUDTC is at more than one visit (investigator records). Based on sdtmchecks::check_tu_tudtc_across_visit.
  Difference from the R function: Independent assessor records count when the engine compares the visits
  of one date. R keeps investigator records only.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-TU-004
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_tu_tudtc_across_visit
        Document: pharmaverse sdtmchecks
        Section: TU Domain
