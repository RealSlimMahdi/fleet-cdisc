# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TU-004: Same TU date across different visits
# Source: sdtmchecks::check_tu_tudtc_across_visit

Core:
  Id: SDTMCHK-TU-004
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [TU]

Check:
  all:
    - name: TUDTC
      operator: non_empty
    - name: TUDTC
      operator: is_inconsistent_across_dataset
      value:
        - USUBJID
        - VISITNUM

Outcome:
  Message: >-
    Same TUDTC date appears across different visits for the subject.
    Each tumor assessment visit should typically have a unique collection date.
  Output Variables: [USUBJID, TULINKID, TUTESTCD, TUDTC, VISIT, VISITNUM]

Description: >-
  TU assessment dates should differ across visits. The same date at multiple
  visits suggests date transcription errors or improper visit assignment.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-TU-004
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_tu_tudtc_across_visit
                Document: Roche sdtmchecks
                Section: TU Domain
