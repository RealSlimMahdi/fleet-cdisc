# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DS-003: Duplicate randomization records
# Based on: sdtmchecks::check_ds_duplicate_randomization. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-DS-003
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - DS
Check:
  all:
  - name: DSDECOD
    operator: contains_case_insensitive
    value: RANDOMIZ
  - name: DSDECOD
    operator: present_on_multiple_rows_within
    within: USUBJID
Outcome:
  Message: The subject has more than one randomization record (DSDECOD contains RANDOMIZ).
  Output Variables:
  - USUBJID
  - DSDECOD
  - DSTERM
  - DSSCAT
  - DSSTDTC
  - DSSEQ
Description: 'Flags: The subject has more than one randomization record (DSDECOD contains RANDOMIZ). Based
  on sdtmchecks::check_ds_duplicate_randomization. Difference from the R function: Two different RANDOMIZ
  terms for one subject (RANDOMIZED and RANDOMIZATION) are not flagged. R counts them together.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-DS-003
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ds_duplicate_randomization
        Document: pharmaverse sdtmchecks
        Section: DS Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [DS]
