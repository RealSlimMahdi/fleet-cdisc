# SDTMCHK-DS-003: Duplicate randomization records
# Source: sdtmchecks::check_ds_duplicate_randomization

Core:
  Id: SDTMCHK-DS-003
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [DS]

Check:
  all:
    - name: DSDECOD
      operator: equal_to
      value: "RANDOMIZED"
      value_is_literal: true
    - name: DSDECOD
      operator: present_on_multiple_rows_within
      within: USUBJID

Outcome:
  Message: >-
    Subject has multiple randomization records (DSDECOD='RANDOMIZED') in DS.
    Each subject should have at most one randomization disposition record.
  Output Variables: [USUBJID, DSDECOD, DSTERM, DSSCAT, DSSTDTC, DSSEQ]

Description: >-
  Each subject should have only one record with DSDECOD='RANDOMIZED' in DS.
  Multiple randomization records indicate a data entry error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-DS-003
              Version: '1'
            Citations:
              - Cited Guidance: check_ds_duplicate_randomization
                Document: Roche sdtmchecks
                Section: DS Domain
