# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-EX-006: EXOCCUR missing but EXDOSE populated
# Source: sdtmchecks::check_ex_exoccur_mis_exdose_nonmis

Core:
  Id: SDTMCHK-EX-006
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [INTERVENTIONS]
  Domains:
    Include: [EX]

Check:
  all:
    - name: EXOCCUR
      operator: empty
    - name: EXDOSE
      operator: non_empty

Outcome:
  Message: >-
    EXOCCUR is missing but EXDOSE is populated. When a dose value is recorded,
    the occurrence flag should indicate whether exposure actually happened.
  Output Variables: [USUBJID, EXTRT, EXSTDTC, EXDOSE, EXOCCUR]

Description: >-
  When EXDOSE is populated, EXOCCUR should also be populated.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-EX-006
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ex_exoccur_mis_exdose_nonmis
                Document: Roche sdtmchecks
                Section: EX Domain
