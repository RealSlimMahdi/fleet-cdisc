# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-017: Partial death dates in AE/DS
# Based on: sdtmchecks::check_ae_ds_partial_death_dates. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-017
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - AE
Check:
  all:
  - name: AEDTHDTC
    operator: non_empty
  - name: AEDTHDTC
    operator: shorter_than
    value: 10
Outcome:
  Message: AEDTHDTC is a partial date (fewer than 10 characters).
  Output Variables:
  - USUBJID
  - AETERM
  - AEDTHDTC
  - AESDTH
  - AEOUT
Description: 'Flags: AEDTHDTC is a partial date (fewer than 10 characters). Based on sdtmchecks::check_ae_ds_partial_death_dates.
  Difference from the R function: Only AEDTHDTC is checked. R also checks the DS death date (DSSTDTC of
  DEATH records).'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-AE-017
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ae_ds_partial_death_dates
        Document: pharmaverse sdtmchecks
        Section: AE Domain
