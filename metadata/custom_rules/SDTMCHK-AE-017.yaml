# SDTMCHK-AE-017: Partial death dates in AE/DS
# Source: sdtmchecks::check_ae_ds_partial_death_dates

Core:
  Id: SDTMCHK-AE-017
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AEDTHDTC
      operator: non_empty
    - name: AEDTHDTC
      operator: is_incomplete_date

Outcome:
  Message: >-
    AEDTHDTC is a partial (incomplete) date. Death dates should be complete
    dates (YYYY-MM-DD) for accurate safety reporting.
  Output Variables: [USUBJID, AETERM, AEDTHDTC, AESDTH, AEOUT]

Description: >-
  AEDTHDTC should be a complete date (minimum YYYY-MM-DD precision).
  Partial death dates are problematic for safety analysis.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-017
              Version: '1'
            Citations:
              - Cited Guidance: check_ae_ds_partial_death_dates
                Document: Roche sdtmchecks
                Section: AE Domain
