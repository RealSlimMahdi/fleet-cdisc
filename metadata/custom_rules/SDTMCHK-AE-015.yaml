# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-015: DS death record exists but no AEDTHDTC in AE
# Based on: sdtmchecks::check_ae_aedthdtc_ds_death. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-015
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - DS
Check:
  all:
  - name: DSDECOD
    operator: contains_case_insensitive
    value: DEATH
  - name: DSTERM
    operator: contains_case_insensitive
    value: ADVERSE EVENT
  - name: $ae_dth
    operator: empty
Operations:
- operator: max_date
  domain: AE
  name: AEDTHDTC
  id: $ae_dth
  group:
  - USUBJID
Outcome:
  Message: DS records a death due to an adverse event, but no AE record of the subject has AEDTHDTC.
  Output Variables:
  - USUBJID
  - DSDECOD
  - DSSTDTC
  - DSTERM
  - $ae_dth
Description: 'Flags: DS records a death due to an adverse event, but no AE record of the subject has AEDTHDTC.
  Based on sdtmchecks::check_ae_aedthdtc_ds_death. Same conditions as the R function.
  Needs AEDTHDTC (sponsor variable, not in SDTMIG 3.4 AE); on standard data see CORE-000253, CORE-000254, CORE-000841.'
Sensitivity: Record
Executability: Partially Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-AE-015
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ae_aedthdtc_ds_death
        Document: pharmaverse sdtmchecks
        Section: AE Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [DS]
