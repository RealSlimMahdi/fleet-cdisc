# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-001: AEDECOD must not be missing
# Based on: sdtmchecks::check_ae_aedecod. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-001
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AEDECOD
      operator: empty

Outcome:
  Message: >-
    AEDECOD is missing. All adverse events must have a coded preferred term
    (dictionary-derived decode).
  Output Variables: [USUBJID, AETERM, AEDECOD]

Description: >-
  AEDECOD (dictionary-derived decoded term) must be populated for every AE record.
  Based on sdtmchecks::check_ae_aedecod. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ae_aedecod
                Document: pharmaverse sdtmchecks
                Section: AE Domain
    Category:
      Purpose: Data quality check from sdtmchecks
      Keywords: [AE]
