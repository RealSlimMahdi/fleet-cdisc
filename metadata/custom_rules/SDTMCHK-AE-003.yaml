# SDTMCHK-AE-003: AESDTH="Y" but AEDTHDTC is missing
# Source: sdtmchecks::check_ae_aesdth_aedthdtc

Core:
  Id: SDTMCHK-AE-003
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AESDTH
      operator: equal_to
      value: "Y"
      value_is_literal: true
    - name: AEDTHDTC
      operator: empty

Outcome:
  Message: >-
    AESDTH is 'Y' but AEDTHDTC is missing. When death is indicated as a
    seriousness criterion, the death date should be recorded.
  Output Variables: [USUBJID, AETERM, AEDECOD, AESTDTC, AESDTH, AEDTHDTC]

Description: >-
  When AESDTH equals 'Y', AEDTHDTC (death date) should be populated.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-003
              Version: '1'
            Citations:
              - Cited Guidance: check_ae_aesdth_aedthdtc
                Document: Roche sdtmchecks
                Section: AE Domain
