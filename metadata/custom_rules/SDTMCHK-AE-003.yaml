# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-003: AESDTH="Y" but AEDTHDTC is missing
# Based on: sdtmchecks::check_ae_aesdth_aedthdtc. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-003
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AESDTH
      operator: equal_to
      value: "Y"
      value_is_literal: true
    - name: AEDTHDTC
      operator: empty

Outcome:
  Message: >-
    AESDTH is 'Y' but AEDTHDTC is missing. When death is indicated as a
    seriousness criterion, the death date should be recorded.
  Output Variables: [USUBJID, AETERM, AEDECOD, AESTDTC, AESDTH, AEDTHDTC]

Description: >-
  When AESDTH equals 'Y', AEDTHDTC (death date) should be populated.
  Based on sdtmchecks::check_ae_aesdth_aedthdtc. Same conditions as the R function.
  Needs AEDTHDTC (sponsor variable, not in SDTMIG 3.4 AE); on standard data see CORE-000253, CORE-000254, CORE-000841.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-003
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ae_aesdth_aedthdtc
                Document: pharmaverse sdtmchecks
                Section: AE Domain
    Category:
      Purpose: Data quality check from sdtmchecks
      Keywords: [AE]
