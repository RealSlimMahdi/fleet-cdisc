# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-CE-001: CE dates missing month (incomplete date)
# Source: sdtmchecks::check_ce_missing_month

Core:
  Id: SDTMCHK-CE-001
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [CE]

Check:
  all:
    - name: CESTDTC
      operator: non_empty
    - name: CESTDTC
      operator: is_incomplete_date

Outcome:
  Message: >-
    CESTDTC is an incomplete (partial) date. Clinical event dates should
    have at least month-level precision (YYYY-MM or YYYY-MM-DD).
  Output Variables: [USUBJID, CETERM, CESTDTC, VISIT]

Description: >-
  CE start dates should be complete or at minimum include month precision.
  Year-only dates (YYYY) or dates missing month indicate data quality issues.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-CE-001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ce_missing_month
                Document: Roche sdtmchecks
                Section: CE Domain
