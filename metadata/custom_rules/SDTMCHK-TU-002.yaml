# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TU-002: TULOC missing for target lesions
# Source: sdtmchecks::check_tu_tuloc_missing

Core:
  Id: SDTMCHK-TU-002
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [TU]

Check:
  all:
    - name: TUORRES
      operator: equal_to
      value: "TARGET"
      value_is_literal: true
    - name: TULOC
      operator: empty

Outcome:
  Message: >-
    TUORRES is 'TARGET' but TULOC (tumor location) is missing.
    Target lesions must have their anatomical location recorded.
  Output Variables: [USUBJID, TUTESTCD, TUORRES, TULOC, VISIT, TUDTC]

Description: >-
  TULOC must be populated when TUORRES is 'TARGET'.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-TU-002
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_tu_tuloc_missing
                Document: pharmaverse sdtmchecks
                Section: TU Domain (ONC)
