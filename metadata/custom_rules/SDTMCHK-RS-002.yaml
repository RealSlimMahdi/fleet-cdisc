# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-RS-002: RS visit date ordering error
# Source: sdtmchecks::check_rs_rsdtc_visit_ordinal_error

Core:
  Id: SDTMCHK-RS-002
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [RS]

Check:
  all:
    - name: RSDTC
      operator: non_empty
    - name: VISITNUM
      operator: non_empty
    - name: VISITNUM
      operator: target_is_not_sorted_by
      within:
        - USUBJID
      value:
        - name: RSDTC
          sort_order: asc

Outcome:
  Message: >-
    RS visit ordering error: VISITNUM is not consistent with chronological
    order of RSDTC within the subject. A later visit has an earlier date.
  Output Variables: [USUBJID, RSCAT, RSSCAT, VISIT, VISITNUM, RSDTC]

Description: >-
  Within each subject, RS records at later visits should have later or equal RSDTC.
  An earlier date at a later visit suggests data error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-RS-002
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_rs_rsdtc_visit_ordinal_error
                Document: pharmaverse sdtmchecks
                Section: RS Domain
