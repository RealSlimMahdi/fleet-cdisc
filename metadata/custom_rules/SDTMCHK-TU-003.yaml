# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TU-003: TU visit date ordering error
# Source: sdtmchecks::check_tu_tudtc_visit_ordinal_error

Core:
  Id: SDTMCHK-TU-003
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [TU]

Check:
  all:
    - name: TUDTC
      operator: non_empty
    - name: VISITNUM
      operator: non_empty
    - name: VISITNUM
      operator: target_is_not_sorted_by
      within:
        - USUBJID
        - TULINKID
      value:
        - name: TUDTC
          sort_order: asc

Outcome:
  Message: >-
    TU visit ordering error: VISITNUM is not consistent with chronological
    order of TUDTC within the subject and lesion. A later visit has an earlier date.
  Output Variables: [USUBJID, TULINKID, TUTESTCD, VISIT, VISITNUM, TUDTC]

Description: >-
  Within each subject and tumor identification link, TU records at later visits
  should have later or equal TUDTC. An earlier date at a later visit suggests data error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-TU-003
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_tu_tudtc_visit_ordinal_error
                Document: Roche sdtmchecks
                Section: TU Domain
