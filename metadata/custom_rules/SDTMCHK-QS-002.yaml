# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-QS-002: QS visit date ordering error
# Source: sdtmchecks::check_qs_qsdtc_visit_ordinal_error

Core:
  Id: SDTMCHK-QS-002
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [QS]

Check:
  all:
    - name: QSDTC
      operator: non_empty
    - name: VISITNUM
      operator: non_empty
    - name: VISITNUM
      operator: target_is_not_sorted_by
      within:
        - USUBJID
        - QSTESTCD
      value:
        - name: QSDTC
          sort_order: asc

Outcome:
  Message: >-
    QS visit ordering error: VISITNUM is not consistent with chronological
    order of QSDTC within the subject and test. A later visit has an earlier date.
  Output Variables: [USUBJID, QSTESTCD, QSCAT, VISIT, VISITNUM, QSDTC]

Description: >-
  Within each subject and questionnaire test, records at later visits should have
  later or equal QSDTC. An earlier date at a later visit suggests data error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-QS-002
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_qs_qsdtc_visit_ordinal_error
                Document: pharmaverse sdtmchecks
                Section: QS Domain
