# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DS-007: Treatment discontinuation due to AE but no matching AE
# Based on: sdtmchecks::check_ds_ae_discon. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-DS-007
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - DS
Check:
  all:
  - name: DSCAT
    operator: equal_to
    value: DISPOSITION EVENT
    value_is_literal: true
  - name: DSSPID
    operator: contains
    value: DISCTX
  - name: DSDECOD
    operator: equal_to
    value: ADVERSE EVENT
    value_is_literal: true
  - name: USUBJID
    operator: is_not_contained_by
    value: $ae_withdrawn_subjects
Operations:
- operator: distinct
  domain: AE
  name: USUBJID
  id: $ae_withdrawn_subjects
  filter:
    AEACN: DRUG WITHDRAWN
Outcome:
  Message: Treatment discontinuation due to an adverse event (DSSPID contains DISCTX) but no AE record
    with AEACN = 'DRUG WITHDRAWN'.
  Output Variables:
  - USUBJID
  - DSDECOD
  - DSSCAT
  - DSTERM
  - DSSTDTC
Description: 'Flags: Treatment discontinuation due to an adverse event (DSSPID contains DISCTX) but no
  AE record with AEACN = ''DRUG WITHDRAWN''. Based on sdtmchecks::check_ds_ae_discon. Difference from
  the R function: Only AEACN is read. R also reads AEACN1, AEACN2, ... when the study has them.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-DS-007
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ds_ae_discon
        Document: pharmaverse sdtmchecks
        Section: DS Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [DS]
