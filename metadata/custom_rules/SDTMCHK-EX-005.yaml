# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-EX-005: VISIT missing when exposure occurred
# Based on: sdtmchecks::check_ex_visit. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-EX-005
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [INTERVENTIONS]
  Domains:
    Include: [EX]

Check:
  all:
    - any:
        - name: EXOCCUR
          operator: equal_to
          value: "Y"
          value_is_literal: true
        - name: EXOCCUR
          operator: not_exists
    - name: VISIT
      operator: empty

Outcome:
  Message: >-
    VISIT is missing for a record where exposure occurred.
    Visit information should be recorded for exposure records.
  Output Variables: [USUBJID, EXTRT, EXSTDTC, EXDOSE, VISIT, EXOCCUR]

Description: >-
  VISIT must be populated when EXOCCUR is 'Y' or EXOCCUR does not exist.
  Based on sdtmchecks::check_ex_visit. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-EX-005
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ex_visit
                Document: pharmaverse sdtmchecks
                Section: EX Domain
