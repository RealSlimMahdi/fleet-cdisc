# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-LB-007: LB reference ranges missing for numeric results
# Based on: sdtmchecks::check_lb_lbstnrlo_lbstnrhi. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-LB-007
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [LB]

Check:
  all:
    - name: LBSTRESN
      operator: non_empty
    - any:
        - name: LBSTNRLO
          operator: empty
        - name: LBSTNRHI
          operator: empty

Outcome:
  Message: >-
    LBSTRESN is populated but LBSTNRLO and/or LBSTNRHI (standard reference
    ranges) are missing. Numeric lab results should have reference ranges.
  Output Variables:
    [USUBJID, LBTESTCD, LBTEST, LBSTRESN, LBSTRESU, LBSTNRLO, LBSTNRHI]

Description: >-
  When LBSTRESN is populated, both LBSTNRLO and LBSTNRHI should ideally be
  present for proper lab result interpretation and flagging.
  Based on sdtmchecks::check_lb_lbstnrlo_lbstnrhi. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-LB-007
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_lb_lbstnrlo_lbstnrhi
                Document: pharmaverse sdtmchecks
                Section: LB Domain
