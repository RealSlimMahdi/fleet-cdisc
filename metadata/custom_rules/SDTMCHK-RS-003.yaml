# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-RS-003: Same RS date across different visits
# Source: sdtmchecks::check_rs_rsdtc_across_visit

Core:
  Id: SDTMCHK-RS-003
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [RS]

Check:
  all:
    - name: RSDTC
      operator: non_empty
    - name: RSDTC
      operator: is_inconsistent_across_dataset
      value:
        - USUBJID
        - VISITNUM

Outcome:
  Message: >-
    Same RSDTC date appears across different visits for the subject.
    Each assessment visit should typically have a unique collection date.
  Output Variables: [USUBJID, RSCAT, RSTESTCD, RSDTC, VISIT, VISITNUM]

Description: >-
  RS assessment dates should differ across visits. The same date at multiple
  visits suggests date transcription errors or improper visit assignment.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-RS-003
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_rs_rsdtc_across_visit
                Document: Roche sdtmchecks
                Section: RS Domain
