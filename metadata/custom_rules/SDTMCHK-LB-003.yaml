# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-LB-003: LBORRES/LBSTRESC contains < or > prefix
# Based on: sdtmchecks::check_lb_lbstresc_char. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-LB-003
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - LB
Check:
  all:
  - name: LBORRES
    operator: non_empty
  - name: LBSTRESC
    operator: non_empty
  - name: LBSTRESN
    operator: empty
  - name: LBSTRESC
    operator: matches_regex
    value: .*[><][0-9]
Outcome:
  Message: LBSTRESC holds '<' or '>' followed by a number, and LBSTRESN is missing.
  Output Variables:
  - USUBJID
  - LBTESTCD
  - LBDTC
  - LBORRES
  - LBSTRESC
  - LBSTRESN
Description: 'Flags: LBSTRESC holds ''<'' or ''>'' followed by a number, and LBSTRESN is missing. Based
  on sdtmchecks::check_lb_lbstresc_char. Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-LB-003
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_lb_lbstresc_char
        Document: pharmaverse sdtmchecks
        Section: LB Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [LB]
