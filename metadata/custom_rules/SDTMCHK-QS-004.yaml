# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-QS-004: Duplicate QS records at same visit
# Based on: sdtmchecks::check_qs_dup. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-QS-004
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - QS
Check:
  all:
  - name: QSDTC
    operator: non_empty
  - name: VISIT
    operator: does_not_contain
    value: UNSCHEDU
  - name: QSDTC
    operator: is_inconsistent_across_dataset
    value:
    - USUBJID
    - QSCAT
    - VISITNUM
Outcome:
  Message: The subject has more than one QSDTC at one visit of a questionnaire (QSCAT).
  Output Variables:
  - USUBJID
  - QSTESTCD
  - QSCAT
  - QSDTC
  - VISIT
  - VISITNUM
  - QSSEQ
Description: 'Flags: The subject has more than one QSDTC at one visit of a questionnaire (QSCAT). Based
  on sdtmchecks::check_qs_dup. Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-QS-004
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_qs_dup
        Document: pharmaverse sdtmchecks
        Section: QS Domain
