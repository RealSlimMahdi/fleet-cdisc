# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DS-004: Multiple death records with different dates
# Based on: sdtmchecks::check_ds_multdeath_dsstdtc. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-DS-004
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - DS
Check:
  all:
  - name: DSDECOD
    operator: equal_to
    value: DEATH
    value_is_literal: true
  - name: DSSTDTC
    operator: non_empty
  - name: DSSTDTC
    operator: is_inconsistent_across_dataset
    value:
    - USUBJID
    - DSDECOD
Outcome:
  Message: The subject has DEATH records in DS with more than one DSSTDTC.
  Output Variables:
  - USUBJID
  - DSDECOD
  - DSSCAT
  - DSSTDTC
  - DSTERM
  - DSSEQ
Description: 'Flags: The subject has DEATH records in DS with more than one DSSTDTC. Based on sdtmchecks::check_ds_multdeath_dsstdtc.
  Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-DS-004
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ds_multdeath_dsstdtc
        Document: pharmaverse sdtmchecks
        Section: DS Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [DS]
