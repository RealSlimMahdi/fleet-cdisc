# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-008: AEOUT=RECOVERED/RESOLVED but AEENDTC missing
# Based on: sdtmchecks::check_ae_aeout_aeendtc_nonfatal. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-008
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AEOUT
      operator: is_contained_by
      value: ["RECOVERED/RESOLVED", "RECOVERED/RESOLVED WITH SEQUELAE"]
    - name: AEENDTC
      operator: empty

Outcome:
  Message: >-
    AEOUT indicates recovery but AEENDTC is missing. Resolved AEs
    should have an end date recorded.
  Output Variables: [USUBJID, AETERM, AEDECOD, AEOUT, AEENDTC]

Description: >-
  When AEOUT is 'RECOVERED/RESOLVED' or 'RECOVERED/RESOLVED WITH SEQUELAE',
  AEENDTC should be populated.
  Based on sdtmchecks::check_ae_aeout_aeendtc_nonfatal. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-008
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ae_aeout_aeendtc_nonfatal
                Document: pharmaverse sdtmchecks
                Section: AE Domain
