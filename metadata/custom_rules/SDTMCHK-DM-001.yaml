# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DM-001: AGE missing or suspicious values
# Based on: sdtmchecks::check_dm_age_missing. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-DM-001
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [SPECIAL PURPOSE]
  Domains:
    Include: [DM]

Check:
  any:
    - name: AGE
      operator: empty
    - name: AGE
      operator: less_than
      value: 18
    - name: AGE
      operator: greater_than_or_equal_to
      value: 90

Outcome:
  Message: >-
    AGE is missing, below 18, or >= 90. These values should be reviewed
    for data quality.
  Output Variables: [USUBJID, AGE]

Description: >-
  AGE must be populated and should be between 18 and 89 for adult studies.
  Records outside this range are flagged for review.
  Based on sdtmchecks::check_dm_age_missing. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-DM-001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_dm_age_missing
                Document: pharmaverse sdtmchecks
                Section: DM Domain
