# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-RS-004: RSDTC or VISIT missing for INV assessments
# Based on: sdtmchecks::check_rs_rsdtc_visit. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-RS-004
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - RS
Check:
  all:
  - any:
    - name: RSDTC
      operator: empty
    - name: VISIT
      operator: empty
  - name: RSORRES
    operator: non_empty
  - name: RSSTAT
    operator: non_empty
  - name: RSSTAT
    operator: not_equal_to_case_insensitive
    value: NOT DONE
  - any:
    - name: RSEVAL
      operator: not_exists
    - name: RSEVAL
      operator: empty
    - name: RSEVAL
      operator: equal_to_case_insensitive
      value: INVESTIGATOR
Outcome:
  Message: An investigator RS record with a result has no RSDTC or no VISIT.
  Output Variables:
  - USUBJID
  - RSCAT
  - RSTESTCD
  - RSDTC
  - VISIT
  - VISITNUM
Description: 'Flags: An investigator RS record with a result has no RSDTC or no VISIT. Based on sdtmchecks::check_rs_rsdtc_visit.
  Difference from the R function: As R, a record with a null RSSTAT is not flagged (toupper(RSSTAT) !=
  "NOT DONE" is NA in R).'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-RS-004
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_rs_rsdtc_visit
        Document: pharmaverse sdtmchecks
        Section: RS Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [RS]
