# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-014: Duplicate AE records
# Based on: sdtmchecks::check_ae_dup. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-014
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - AE
Check:
  all:
  - name: AETERM
    operator: is_not_unique_set
    value:
    - USUBJID
    - AEDECOD
    - AESTDTC
    - AEENDTC
    - AESEV
Outcome:
  Message: 'Duplicate AE record: USUBJID, AETERM, AEDECOD, AESTDTC, AEENDTC and AESEV are not unique.'
  Output Variables:
  - USUBJID
  - AETERM
  - AEDECOD
  - AESTDTC
  - AEENDTC
  - AESEQ
Description: 'Flags: Duplicate AE record: USUBJID, AETERM, AEDECOD, AESTDTC, AEENDTC and AESEV are not
  unique. Based on sdtmchecks::check_ae_dup. Difference from the R function: The key has AESEV; AETOXGR,
  AELAT and AEMODIFY are not in the key. R adds each of them when the study has it.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-AE-014
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ae_dup
        Document: pharmaverse sdtmchecks
        Section: AE Domain
