# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-LB-004: LB visit date ordering error
# Source: sdtmchecks::check_lb_lbdtc_visit_ordinal_error

Core:
  Id: SDTMCHK-LB-004
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [LB]

Check:
  all:
    - name: LBDTC
      operator: non_empty
    - name: VISITNUM
      operator: non_empty
    - name: VISITNUM
      operator: target_is_not_sorted_by
      within:
        - USUBJID
        - LBTESTCD
      value:
        - name: LBDTC
          sort_order: asc

Outcome:
  Message: >-
    LB visit ordering error: VISITNUM is not consistent with chronological
    order of LBDTC within the subject and test. A later visit has an earlier date.
  Output Variables: [USUBJID, LBTESTCD, LBTEST, VISIT, VISITNUM, LBDTC]

Description: >-
  Within each subject and lab test, records at later visits should have
  later or equal LBDTC. An earlier date at a later visit suggests data error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-LB-004
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_lb_lbdtc_visit_ordinal_error
                Document: Roche sdtmchecks
                Section: LB Domain
