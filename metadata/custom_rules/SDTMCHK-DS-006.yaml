# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DS-006: Death in DS (DSDECOD=DEATH) without study discontinuation record
# Source: sdtmchecks::check_ds_dsdecod_death

Core:
  Id: SDTMCHK-DS-006
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [DS]

Check:
  all:
    - name: DSDECOD
      operator: equal_to
      value: "DEATH"
      value_is_literal: true
    - name: DSSCAT
      operator: not_equal_to
      value: "STUDY PARTICIPATION"
      value_is_literal: true
    - name: USUBJID
      operator: is_not_contained_by
      value: $study_discon_subjects

Operations:
  - operator: distinct
    domain: DS
    name: USUBJID
    id: $study_discon_subjects
    filter:
      DSSCAT: "STUDY PARTICIPATION"

Outcome:
  Message: >-
    Subject has a death record in DS but no study participation discontinuation
    record (DSSCAT='STUDY PARTICIPATION'). Death should trigger study discontinuation.
  Output Variables: [USUBJID, DSDECOD, DSSCAT, DSTERM, DSSTDTC]

Description: >-
  When DSDECOD='DEATH' exists, there should also be a corresponding study
  participation disposition record for the subject.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-DS-006
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ds_dsdecod_death
                Document: Roche sdtmchecks
                Section: DS Domain
