# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-016: AEDTHDTC does not match DS death date
# Based on: sdtmchecks::check_dd_ae_aedthdtc_ds_dsstdtc. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-016
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - AE
Check:
  all:
  - name: AEDTHDTC
    operator: non_empty
  - name: $ds_death_dates
    operator: non_empty
  - name: AEDTHDTC
    operator: is_not_contained_by
    value: $ds_death_dates
Operations:
- operator: distinct
  domain: DS
  name: DSSTDTC
  id: $ds_death_dates
  group:
  - USUBJID
  filter:
    DSDECOD: DEATH
Outcome:
  Message: AEDTHDTC equals none of the DS death dates (DSSTDTC where DSDECOD = 'DEATH').
  Output Variables:
  - USUBJID
  - AETERM
  - AEDTHDTC
  - $ds_death_dates
Description: 'Flags: AEDTHDTC equals none of the DS death dates (DSSTDTC where DSDECOD = ''DEATH''). Based
  on sdtmchecks::check_dd_ae_aedthdtc_ds_dsstdtc. Difference from the R function: The rule fires when
  AEDTHDTC equals none of the DS death dates. R fires for each DS death date that differs.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-AE-016
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_dd_ae_aedthdtc_ds_dsstdtc
        Document: pharmaverse sdtmchecks
        Section: Death Date Checks
