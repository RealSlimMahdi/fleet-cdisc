# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-QS-005: NOT DONE status but QSSTRESC responses populated
# Source: sdtmchecks::check_qs_qsstat_qsstresc

Core:
  Id: SDTMCHK-QS-005
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [QS]

Check:
  all:
    - name: QSSTAT
      operator: equal_to
      value: "NOT DONE"
      value_is_literal: true
    - name: QSSTRESC
      operator: non_empty

Outcome:
  Message: >-
    QSSTAT is 'NOT DONE' but QSSTRESC is populated. When a questionnaire
    is marked as not done, response values should be empty.
  Output Variables: [USUBJID, QSTESTCD, QSCAT, QSSTAT, QSSTRESC, VISIT]

Description: >-
  When QSSTAT='NOT DONE', QSSTRESC (and result fields) should be empty.
  Having response values for a not-done assessment is contradictory.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-QS-005
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_qs_qsstat_qsstresc
                Document: Roche sdtmchecks
                Section: QS Domain
