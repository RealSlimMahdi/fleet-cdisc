# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TR-001: TRSTRESN missing for Longest Diameter
# Source: sdtmchecks::check_tr_trstresn_ldiam

Core:
  Id: SDTMCHK-TR-001
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [TR]

Check:
  all:
    - name: TRTESTCD
      operator: equal_to
      value: "LDIAM"
      value_is_literal: true
    - name: TRSTRESN
      operator: empty

Outcome:
  Message: >-
    TRTESTCD is 'LDIAM' (Longest Diameter) but TRSTRESN is missing.
    Tumor measurements must have a numeric standardized result.
  Output Variables: [USUBJID, TRTESTCD, TRDTC, VISIT, TRORRES, TRSTRESN]

Description: >-
  TRSTRESN must be populated for TRTESTCD='LDIAM' (longest diameter measurements).

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-TR-001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_tr_trstresn_ldiam
                Document: Roche sdtmchecks
                Section: TR Domain (ONC)
