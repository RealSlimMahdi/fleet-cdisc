# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TR-001: TRSTRESN missing for Longest Diameter
# Based on: sdtmchecks::check_tr_trstresn_ldiam. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-TR-001
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - TR
Check:
  all:
  - name: TRTESTCD
    operator: equal_to
    value: LDIAM
    value_is_literal: true
  - name: TRSTRESN
    operator: empty
  - any:
    - name: TREVAL
      operator: not_exists
    - name: TREVAL
      operator: empty
    - name: TREVAL
      operator: equal_to_case_insensitive
      value: INVESTIGATOR
Outcome:
  Message: Investigator LDIAM record with no TRSTRESN.
  Output Variables:
  - USUBJID
  - TRTESTCD
  - TRDTC
  - VISIT
  - TRORRES
  - TRSTRESN
Description: 'Flags: Investigator LDIAM record with no TRSTRESN. Based on sdtmchecks::check_tr_trstresn_ldiam.
  Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-TR-001
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_tr_trstresn_ldiam
        Document: pharmaverse sdtmchecks
        Section: TR Domain (ONC)
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [TR]
