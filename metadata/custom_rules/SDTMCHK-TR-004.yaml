# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TR-004: Same TR date across different visits
# Based on: sdtmchecks::check_tr_trdtc_across_visit. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-TR-004
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - TR
Check:
  all:
  - name: TRTESTCD
    operator: equal_to
    value: LDIAM
    value_is_literal: true
  - name: TRDTC
    operator: non_empty
  - any:
    - name: TREVAL
      operator: not_exists
    - name: TREVAL
      operator: empty
    - name: TREVAL
      operator: equal_to_case_insensitive
      value: INVESTIGATOR
  - name: VISITNUM
    operator: is_inconsistent_across_dataset
    value:
    - USUBJID
    - TRDTC
Outcome:
  Message: The same TRDTC is at more than one visit (investigator LDIAM records).
  Output Variables:
  - USUBJID
  - TRLINKID
  - TRTESTCD
  - TRDTC
  - VISIT
  - VISITNUM
Description: 'Flags: The same TRDTC is at more than one visit (investigator LDIAM records). Based on sdtmchecks::check_tr_trdtc_across_visit.
  Difference from the R function: Independent assessor records count when the engine compares the visits
  of one date. R keeps investigator records only.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-TR-004
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_tr_trdtc_across_visit
        Document: pharmaverse sdtmchecks
        Section: TR Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [TR]
