# SDTMCHK-AE-013: AE start date after death date from DS
# Source: sdtmchecks::check_ae_aestdtc_after_dd

Core:
  Id: SDTMCHK-AE-013
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AESTDTC
      operator: non_empty
    - name: $ds_death_date
      operator: non_empty
    - name: AESTDTC
      operator: date_greater_than
      value: $ds_death_date
      date_component: auto

Operations:
  - operator: max_date
    domain: DS
    name: DSSTDTC
    id: $ds_death_date
    group:
      - USUBJID
    filter:
      DSDECOD: DEATH

Outcome:
  Message: >-
    AESTDTC is after the death date (DSSTDTC where DSDECOD='DEATH') from DS domain.
    Adverse events should not start after the subject's death.
  Output Variables: [USUBJID, AETERM, AEDECOD, AESTDTC, $ds_death_date]

Description: >-
  AE start date should not be after the subject's death date recorded in DS.
  Uses the maximum DSSTDTC where DSDECOD='DEATH' for each subject.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-013
              Version: '1'
            Citations:
              - Cited Guidance: check_ae_aestdtc_after_dd
                Document: Roche sdtmchecks
                Section: AE Domain
