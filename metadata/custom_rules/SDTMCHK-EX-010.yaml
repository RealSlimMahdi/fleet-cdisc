# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-EX-010: IV infusion with same start and end time
# Based on: sdtmchecks::check_ex_infusion_exstdtc_exendtc. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-EX-010
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - INTERVENTIONS
  Domains:
    Include:
    - EX
Check:
  all:
  - name: EXROUTE
    operator: contains_case_insensitive
    value: INTRAVENOUS
  - any:
    - all:
      - name: EXSTDTC
        operator: non_empty
      - name: EXENDTC
        operator: empty
    - all:
      - name: EXSTDTC
        operator: empty
      - name: EXENDTC
        operator: non_empty
    - all:
      - name: EXSTDTC
        operator: non_empty
      - name: EXENDTC
        operator: non_empty
      - name: EXSTDTC
        operator: date_not_equal_to
        value: EXENDTC
        date_component: day
    - all:
      - name: EXSTDTC
        operator: non_empty
      - name: EXENDTC
        operator: non_empty
      - name: EXSTDTC
        operator: date_greater_than
        value: EXENDTC
Outcome:
  Message: 'IV infusion: a start or end date is missing, the start and end dates differ, or the start
    is after the end.'
  Output Variables:
  - USUBJID
  - EXTRT
  - EXROUTE
  - EXSTDTC
  - EXENDTC
  - EXDOSE
  - VISIT
Description: 'Flags: IV infusion: a start or end date is missing, the start and end dates differ, or the
  start is after the end. Based on sdtmchecks::check_ex_infusion_exstdtc_exendtc. Same conditions as the
  R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-EX-010
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ex_infusion_exstdtc_exendtc
        Document: pharmaverse sdtmchecks
        Section: EX Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [EX]
