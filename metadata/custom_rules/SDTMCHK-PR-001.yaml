# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-PR-001: PR date missing month (incomplete date)
# Based on: sdtmchecks::check_pr_missing_month. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-PR-001
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - INTERVENTIONS
  Domains:
    Include:
    - PR
Check:
  any:
  - all:
    - name: PRSTDTC
      operator: exists
    - name: PRSTDTC
      operator: matches_regex
      value: ^\d{4}---
  - all:
    - name: PRENDTC
      operator: exists
    - name: PRENDTC
      operator: matches_regex
      value: ^\d{4}---
Outcome:
  Message: A PR date (PRSTDTC or PRENDTC) has a year and a day but no month (yyyy---dd).
  Output Variables:
  - USUBJID
  - PRTERM
  - PRDECOD
  - PRSTDTC
  - PRENDTC
Description: 'Flags: A PR date (PRSTDTC or PRENDTC) has a year and a day but no month (yyyy---dd). Based
  on sdtmchecks::check_pr_missing_month. Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-PR-001
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_pr_missing_month
        Document: pharmaverse sdtmchecks
        Section: PR Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [PR]
