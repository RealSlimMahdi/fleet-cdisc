# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-LB-005: LB date missing month (incomplete date)
# Based on: sdtmchecks::check_lb_missing_month. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-LB-005
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - LB
Check:
  all:
  - name: LBDTC
    operator: matches_regex
    value: ^\d{4}---
Outcome:
  Message: LBDTC has a year and a day but no month (yyyy---dd).
  Output Variables:
  - USUBJID
  - LBTESTCD
  - LBTEST
  - LBDTC
  - VISIT
Description: 'Flags: LBDTC has a year and a day but no month (yyyy---dd). Based on sdtmchecks::check_lb_missing_month.
  Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-LB-005
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_lb_missing_month
        Document: pharmaverse sdtmchecks
        Section: LB Domain
