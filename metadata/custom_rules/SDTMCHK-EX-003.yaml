# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-EX-003: EXDOSU missing when exposure occurred
# Based on: sdtmchecks::check_ex_exdosu. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-EX-003
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [INTERVENTIONS]
  Domains:
    Include: [EX]

Check:
  all:
    - any:
        - name: EXOCCUR
          operator: equal_to
          value: "Y"
          value_is_literal: true
        - name: EXOCCUR
          operator: not_exists
    - name: EXDOSU
      operator: empty

Outcome:
  Message: >-
    EXDOSU (dose units) is missing for a record where exposure occurred.
    Dose units must be recorded alongside dose values.
  Output Variables: [USUBJID, EXTRT, EXSTDTC, EXDOSE, EXDOSU, EXOCCUR]

Description: >-
  EXDOSU must be populated when EXOCCUR is 'Y' or EXOCCUR does not exist.
  Based on sdtmchecks::check_ex_exdosu. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-EX-003
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ex_exdosu
                Document: pharmaverse sdtmchecks
                Section: EX Domain
    Category:
      Purpose: Data quality check from sdtmchecks
      Keywords: [EX]
