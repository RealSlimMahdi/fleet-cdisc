# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-002: AEDTHDTC populated but AESDTH not "Y"
# Based on: sdtmchecks::check_ae_aedthdtc_aesdth. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-002
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AEDTHDTC
      operator: non_empty
    - name: AESDTH
      operator: not_equal_to
      value: "Y"
      value_is_literal: true

Outcome:
  Message: >-
    AEDTHDTC is populated but AESDTH is not 'Y'. When a death date is recorded,
    the death seriousness criterion must be flagged.
  Output Variables: [USUBJID, AETERM, AEDECOD, AESTDTC, AEDTHDTC, AESDTH]

Description: >-
  When AEDTHDTC (death date) is populated, AESDTH must equal 'Y'.
  Based on sdtmchecks::check_ae_aedthdtc_aesdth. Same conditions as the R function.
  Needs AEDTHDTC (sponsor variable, not in SDTMIG 3.4 AE); on standard data see CORE-000253, CORE-000254, CORE-000841.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-AE-002
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ae_aedthdtc_aesdth
                Document: pharmaverse sdtmchecks
                Section: AE Domain
    Category:
      Purpose: Data quality check from sdtmchecks
      Keywords: [AE]
