# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-DS-001: DSDECOD=DEATH but DSSTDTC missing (no death date in any DS record)
# Based on: sdtmchecks::check_ds_dsdecod_dsstdtc. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-DS-001
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - EVENTS
  Domains:
    Include:
    - DS
Check:
  all:
  - name: DSDECOD
    operator: equal_to
    value: DEATH
    value_is_literal: true
  - name: $death_date
    operator: empty
Outcome:
  Message: The subject has a DEATH record in DS, and no DEATH record has DSSTDTC.
  Output Variables:
  - USUBJID
  - DSDECOD
  - DSTERM
  - DSSCAT
  - DSSTDTC
Description: 'Flags: The subject has a DEATH record in DS, and no DEATH record has DSSTDTC. Based on sdtmchecks::check_ds_dsdecod_dsstdtc.
  Same conditions as the R function.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-DS-001
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_ds_dsdecod_dsstdtc
        Document: pharmaverse sdtmchecks
        Section: DS Domain
Operations:
- operator: max_date
  domain: DS
  name: DSSTDTC
  id: $death_date
  group:
  - USUBJID
  - DSDECOD
