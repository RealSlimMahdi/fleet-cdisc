# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-AE-004: AEOUT inconsistent with AEDTHDTC (death date present but AEOUT not FATAL)
# Based on: sdtmchecks::check_ae_aeout. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-AE-004
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [EVENTS]
  Domains:
    Include: [AE]

Check:
  all:
    - name: AEDTHDTC
      operator: non_empty
    - name: AEOUT
      operator: not_equal_to
      value: "FATAL"
      value_is_literal: true

Outcome:
  Message: >-
    AEDTHDTC is populated but AEOUT is not 'FATAL'. When a death date is
    present, the outcome should indicate a fatal event.
  Output Variables: [USUBJID, AETERM, AEDECOD, AEOUT, AEDTHDTC]

Description: >-
  When AEDTHDTC is populated, AEOUT must be 'FATAL'.
  Based on sdtmchecks::check_ae_aeout. Same conditions as the R function.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_ae_aeout
                Document: pharmaverse sdtmchecks
                Section: AE Domain
