# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-QS-001: QSSTAT=NOT DONE but QSREASND missing
# Source: sdtmchecks::check_qs_qsstat_qsreasnd

Core:
  Id: SDTMCHK-QS-001
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [QS]

Check:
  all:
    - name: QSSTAT
      operator: equal_to
      value: "NOT DONE"
      value_is_literal: true
    - name: QSREASND
      operator: empty

Outcome:
  Message: >-
    QSSTAT is 'NOT DONE' but QSREASND (reason not done) is missing.
    A reason must be provided when a questionnaire is not completed.
  Output Variables: [USUBJID, QSCAT, QSTESTCD, VISIT, QSSTAT, QSREASND]

Description: >-
  When QSSTAT is 'NOT DONE', QSREASND must be populated.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-QS-001
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_qs_qsstat_qsreasnd
                Document: Roche sdtmchecks
                Section: QS Domain
