# SDTMCHK-LB-006: LB date after death date
# Source: sdtmchecks::check_lb_lbdtc_after_dd

Core:
  Id: SDTMCHK-LB-006
  Status: Draft
  Version: '1'

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [LB]

Check:
  all:
    - name: LBDTC
      operator: non_empty
    - name: $ds_death_date
      operator: non_empty
    - name: LBDTC
      operator: date_greater_than
      value: $ds_death_date
      date_component: auto

Operations:
  - operator: max_date
    domain: DS
    name: DSSTDTC
    id: $ds_death_date
    group:
      - USUBJID
    filter:
      DSDECOD: DEATH

Outcome:
  Message: >-
    Lab collection date (LBDTC) is after the death date from DS.
    Subjects should not have lab records after death.
  Output Variables: [USUBJID, LBTESTCD, LBTEST, LBDTC, $ds_death_date]

Description: >-
  LBDTC should not be after the death date (DSSTDTC where DSDECOD='DEATH').

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-LB-006
              Version: '1'
            Citations:
              - Cited Guidance: check_lb_lbdtc_after_dd
                Document: Roche sdtmchecks
                Section: LB Domain
