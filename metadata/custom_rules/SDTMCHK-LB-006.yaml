# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-LB-006: LB date after death date
# Based on: sdtmchecks::check_lb_lbdtc_after_dd. Conditions follow the R function; a difference is stated in Description.

Core:
  Id: SDTMCHK-LB-006
  Status: Draft
  Version: '1'
Rule Type: Record Data
Scope:
  Classes:
    Include:
    - FINDINGS
  Domains:
    Include:
    - LB
Check:
  all:
  - name: LBORRES
    operator: non_empty
  - name: LBDTC
    operator: non_empty
  - name: $dm_dthdtc
    operator: non_empty
  - name: LBDTC
    operator: date_greater_than
    value: $dm_dthdtc
    date_component: auto
Operations:
- operator: max_date
  domain: DM
  name: DTHDTC
  id: $dm_dthdtc
  group:
  - USUBJID
Outcome:
  Message: LBDTC is after the death date (DM.DTHDTC) for a record with a result.
  Output Variables:
  - USUBJID
  - LBTESTCD
  - LBTEST
  - LBDTC
  - $dm_dthdtc
Description: 'Flags: LBDTC is after the death date (DM.DTHDTC) for a record with a result. Based on sdtmchecks::check_lb_lbdtc_after_dd.
  Difference from the R function: The death date is DM.DTHDTC. The R function takes the earliest of AEDTHDTC
  and the DS death dates. Partial dates are compared at their common precision; R imputes day 01.'
Sensitivity: Record
Executability: Fully Executable
Authorities:
- Organization: sdtmchecks
  Standards:
  - Name: SDTMIG
    Version: '3.4'
    References:
    - Origin: sdtmchecks R package
      Rule Identifier:
        Id: SDTMCHK-LB-006
        Version: '1'
      Version: '1'
      Citations:
      - Cited Guidance: check_lb_lbdtc_after_dd
        Document: pharmaverse sdtmchecks
        Section: LB Domain
  Category:
    Purpose: Data quality check from sdtmchecks
    Keywords: [LB]
