# yaml-language-server: $schema=../../src/fleet/validation/schemas/cdisc_rule_schema.json
# SDTMCHK-TR-002: TR visit date ordering error
# Source: sdtmchecks::check_tr_trdtc_visit_ordinal_error

Core:
  Id: SDTMCHK-TR-002
  Status: Draft
  Version: "1"

Rule Type: Record Data

Scope:
  Classes:
    Include: [FINDINGS]
  Domains:
    Include: [TR]

Check:
  all:
    - name: TRDTC
      operator: non_empty
    - name: VISITNUM
      operator: non_empty
    - name: VISITNUM
      operator: target_is_not_sorted_by
      within:
        - USUBJID
        - TRLINKID
      value:
        - name: TRDTC
          sort_order: asc

Outcome:
  Message: >-
    TR visit ordering error: VISITNUM is not consistent with chronological
    order of TRDTC within the subject and lesion. A later visit has an earlier date.
  Output Variables: [USUBJID, TRLINKID, TRTESTCD, VISIT, VISITNUM, TRDTC]

Description: >-
  Within each subject and tumor link, TR records at later visits should have
  later or equal TRDTC. An earlier date at a later visit suggests data error.

Sensitivity: Record
Executability: Fully Executable

Authorities:
  - Organization: sdtmchecks
    Standards:
      - Name: SDTMIG
        Version: "3.4"
        References:
          - Origin: sdtmchecks R package
            Rule Identifier:
              Id: SDTMCHK-TR-002
              Version: "1"
            Version: "1"
            Citations:
              - Cited Guidance: check_tr_trdtc_visit_ordinal_error
                Document: pharmaverse sdtmchecks
                Section: TR Domain
